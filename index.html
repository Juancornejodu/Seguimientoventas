# Seguimientoventas
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Ventas - Dominio Visual</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .nav-tabs { display: flex; margin-bottom: 20px; }
        .nav-tabs button { flex: 1; padding: 10px; cursor: pointer; background: #eee; border: 1px solid #ccc; font-weight: bold; }
        .nav-tabs button.active { background: #0056b3; color: white; border: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button.btn-submit { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        /* Dashboard Styles */
        .dash-card { background: #f8f9fa; border-left: 4px solid #0056b3; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .dash-card h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        .dash-number { font-size: 24px; font-weight: bold; color: #0056b3; }
        .alert-red { border-left-color: #dc3545; }
        .alert-red .dash-number { color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-tabs">
        <button id="btn-form" class="active" onclick="switchTab('form')">📝 Nueva Visita</button>
        <button id="btn-dash" onclick="switchTab('dash')">📊 Mi Dashboard</button>
    </div>

    <!-- PESTAÑA: FORMULARIO -->
    <div id="tab-form" class="tab-content active">
        <form id="crmForm">
            <div class="form-group"><label>Comercio / Empresa *</label><input type="text" name="empresa" required></div>
            <div class="form-group"><label>Zona / Corredor *</label><select name="zona" required><option value="Centro - Peatonales">Centro - Peatonales</option><option value="Centro - Microcentro">Centro - Microcentro</option><option value="San Lorenzo Chico">San Lorenzo Chico</option><option value="Zona Norte">Zona Norte</option><option value="Zona Sur">Zona Sur</option></select></div>
            <div class="form-group"><label>Rubro *</label><select name="rubro" required><option value="Construcción y Corralón">Construcción y Corralón</option><option value="Gastronomía">Gastronomía</option><option value="Indumentaria y Retail">Indumentaria y Retail</option><option value="Salud y Farmacia">Salud y Farmacia</option><option value="Automotor">Automotor</option><option value="Otro">Otro</option></select></div>
            <div class="form-group"><label>Contacto (Decisor) *</label><input type="text" name="decisor" required></div>
            <div class="form-group"><label>WhatsApp *</label><input type="tel" name="telefono" required></div>
            <div class="form-group"><label>Soporte Ofrecido *</label><select name="soporte" required><option value="Shopping El Punto">Shopping El Punto de San Lorenzo chico</option><option value="Galería La Continental">Galería La Continental</option><option value="Galería El Palacio">Galería El Palacio</option><option value="Galería Margalef">Galería Margalef</option><option value="Galería Buenos Aires">Galería Buenos Aires</option><option value="UCASAL">UCASAL</option><option value="Wa">Wa (En negociación)</option><option value="Mix Multisoporte">Mix Multisoporte</option></select></div>
            <div class="form-group"><label>Acción Ejecutada *</label><select name="accion" required><option value="Visita Presencial">Visita Presencial</option><option value="Contacto por WhatsApp">Contacto por WhatsApp</option><option value="Reunión Agendada">Reunión Agendada</option></select></div>
            <div class="form-group"><label>Interés *</label><select name="interes" required><option value="Alto">🔥 Alto (Cotización)</option><option value="Medio">🟡 Medio (Info General)</option><option value="Bajo">🧊 Bajo (Sin ppto)</option><option value="Nulo">❌ Nulo</option></select></div>
            <div class="form-group"><label>Próximo Contacto *</label><input type="date" name="proximo_paso" required></div>
            <div class="form-group"><label>Notas</label><textarea name="notas"></textarea></div>
            <button type="button" id="submitBtn" class="btn-submit" onclick="enviarDatos()">📤 Guardar en Sheets</button>
        </form>
    </div>

    <!-- PESTAÑA: DASHBOARD -->
    <div id="tab-dash" class="tab-content">
        <div class="dash-card">
            <h3>📈 Visitas de la Semana</h3>
            <div class="dash-number">0 / 30</div>
            <p style="margin: 5px 0 0 0; font-size: 12px; color: #666;">Meta: 30 visitas (Actividad)</p>
        </div>
        <div class="dash-card">
            <h3>🔥 Leads Calientes (Interés Alto)</h3>
            <div class="dash-number">0</div>
            <p style="margin: 5px 0 0 0; font-size: 12px; color: #666;">Requieren envío de cotización / cierre</p>
        </div>
        <div class="dash-card alert-red">
            <h3>⏰ Seguimientos Vencidos/Hoy</h3>
            <div class="dash-number">0</div>
            <p style="margin: 5px 0 0 0; font-size: 12px; color: #666;">Revisar agenda de contactos pendientes</p>
        </div>
        <button class="btn-submit" style="background-color:#0056b3" onclick="alert('Esta función traerá los datos desde Sheets en tiempo real.')">🔄 Actualizar Dashboard</button>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('btn-' + tabId).classList.add('active');
    }

    function enviarDatos() {
        const form = document.getElementById('crmForm');
        const btn = document.getElementById('submitBtn');
        
        if(!form.checkValidity()){
            form.reportValidity();
            return;
        }

        btn.innerText = 'Enviando...';
        btn.disabled = true;

        const formData = new FormData(form);
        const url = 'https://script.google.com/macros/s/AKfycbzOpgu-CWOkH3rPSa6_I_Eq40CU43E3ASSB0W5XvY1fSqGTXawKovCCm3SAatk5giyKxA/exec';

        fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            body: new URLSearchParams(formData)
        }).then(() => {
            alert('¡Datos guardados con éxito!');
            form.reset();
            btn.innerText = '📤 Guardar en Sheets';
            btn.disabled = false;
        }).catch(error => {
            alert('Error de conexión.');
            btn.innerText = '📤 Guardar en Sheets';
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
